name: spi-timed-gpio
on:
  push:
    paths:
      - 'src/**'
      - 'experiments/spi_phase/**'
      - 'test/test_spi*.py'
      - 'test/test.py'
      - 'test/test_uart_rx_public.py'
      - 'test/Makefile'
      - 'test/tb.v'
      - 'tools/spi*.py'
      - 'tools/m1_contract_model.py'
      - 'tools/workbench/**'
      - 'docs/specs/spi-timed-gpio-comparison.md'
      - '.github/workflows/spi-timed-gpio.yaml'
  pull_request:
    paths:
      - 'src/**'
      - 'experiments/spi_phase/**'
      - 'test/test_spi*.py'
      - 'test/test.py'
      - 'test/test_uart_rx_public.py'
      - 'test/Makefile'
      - 'test/tb.v'
      - 'tools/spi*.py'
      - 'tools/m1_contract_model.py'
      - 'tools/workbench/**'
      - 'docs/specs/spi-timed-gpio-comparison.md'
      - '.github/workflows/spi-timed-gpio.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spi-timed-gpio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build locked workbench
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/workbench
          file: tools/workbench/Dockerfile
          load: true
          tags: protocol-emulator-asic-workbench:2026-07-29
          cache-from: type=gha,scope=protocol-emulator-workbench-2026-07-29
          cache-to: type=gha,mode=max,scope=protocol-emulator-workbench-2026-07-29
      - name: Verify tools and compare four complete designs
        run: |
          ./tools/workbench.sh Doctor
          docker run --rm --pull=never --init --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace protocol-emulator-asic-workbench:2026-07-29 \
            python3 experiments/spi_phase/qualify_timed_gpio.py --output build/timed-gpio/ci
      - name: Retain bounded attempts, generated sources and witnesses
        if: always()
        run: |
          docker run --rm --pull=never --init --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace protocol-emulator-asic-workbench:2026-07-29 \
            python3 experiments/spi_phase/retain_timed_evidence.py \
            --run build/timed-gpio/ci --output build/timed-gpio/artifact
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spi-timed-gpio-${{ github.sha }}
          path: build/timed-gpio/artifact/
          if-no-files-found: error
          retention-days: 90
