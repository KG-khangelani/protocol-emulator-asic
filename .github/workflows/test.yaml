# Modified 2026-09-25: run the same locked Docker workbench as local Windows.
name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build locked workbench
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: tools/workbench
          file: tools/workbench/Dockerfile
          load: true
          tags: protocol-emulator-asic-workbench:2026-07-29
          cache-from: type=gha,scope=protocol-emulator-workbench-2026-07-29
          cache-to: type=gha,mode=max,scope=protocol-emulator-workbench-2026-07-29

      - name: Run the locked fast verification ladder
        run: ./tools/workbench.sh All

      - name: Record the built image identity
        run: |
          mkdir -p build/ci
          docker image inspect protocol-emulator-asic-workbench:2026-07-29 > build/ci/workbench-image.json

      - name: Collect reproducibility evidence
        if: success()
        run: ./tools/workbench.sh Evidence

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-${{ github.sha }}
          path: |
            build/evidence/
            build/ci/workbench-image.json
            test/results*.xml
            test/tb.fst
            build/synthesis.log
            build/synth.json
          if-no-files-found: error
          retention-days: 90
