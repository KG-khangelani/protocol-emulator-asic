# Modified 2026-09-22: validate metadata, enforce JUnit and collect evidence.
name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install HDL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run checks and collect evidence
        run: make evidence
      - name: Upload local verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.sha }}
          path: build/evidence/
