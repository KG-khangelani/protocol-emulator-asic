# Modified 2026-09-25: run the same locked Docker workbench as local Windows.
name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  learning-windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run read-only lessons without Docker
        shell: pwsh
        run: |
          $status = .\tools\workbench.ps1 LearnStatus | Out-String
          if ($status -notmatch 'HOST LEARNING MODE' -or $status -notmatch 'technical=PASS') {
            throw 'LearnStatus did not use the host-Python path or report the M0 technical gate.'
          }
          $rtl = .\tools\workbench.ps1 LearnM0 RTL | Out-String
          if ($rtl -notmatch 'HOST LEARNING MODE' -or $rtl -notmatch 'rst_n reset-not') {
            throw 'LearnM0 RTL did not use the host-Python path or teach the reset signal.'
          }
          $status
          $rtl

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build locked workbench
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/workbench
          file: tools/workbench/Dockerfile
          load: true
          tags: protocol-emulator-asic-workbench:2026-07-29
          cache-from: type=gha,scope=protocol-emulator-workbench-2026-07-29
          cache-to: type=gha,mode=max,scope=protocol-emulator-workbench-2026-07-29

      - name: Run the locked fast verification ladder
        run: ./tools/workbench.sh All

      - name: Record the built image identity
        run: |
          mkdir -p build/ci
          docker image inspect protocol-emulator-asic-workbench:2026-07-29 > build/ci/workbench-image.json

      - name: Collect reproducibility evidence
        if: success()
        run: ./tools/workbench.sh Evidence

      - name: Compare isolated SPI phase and program-capacity candidates
        run: |
          docker run --rm --pull=never --init --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace protocol-emulator-asic-workbench:2026-07-29 \
            python3 experiments/spi_phase/run_comparison.py --output build/spi-phase-comparison/ci

      - name: Qualify isolated compact phase assertions and legacy refinement
        run: |
          docker run --rm --pull=never --init --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace protocol-emulator-asic-workbench:2026-07-29 \
            python3 experiments/spi_phase/run_formal.py --output build/spi-phase-formal/ci

      - name: Qualify actual compact public loader, capture and abort integration
        run: |
          docker run --rm --pull=never --init --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace protocol-emulator-asic-workbench:2026-07-29 \
            python3 experiments/spi_phase/run_integration.py --output build/spi-phase-integration/ci --with-simulation

      - name: Qualify compact mode-0 external pins and input transport
        run: |
          docker run --rm --pull=never --init --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace protocol-emulator-asic-workbench:2026-07-29 \
            python3 experiments/spi_phase/run_pin_qualification.py --output build/spi-mode0-pins/ci

      - name: Prove actual loaded eight-word program with loop invariants
        run: |
          docker run --rm --pull=never --init --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace protocol-emulator-asic-workbench:2026-07-29 \
            python3 experiments/spi_phase/run_program_invariants.py --output build/spi-program-invariants/ci
          python3 - <<'PY'
          import json
          result = json.load(open('build/spi-program-invariants/ci/result.json'))
          assert result['status'] == 'PROVED_WRITTEN_PROGRAM_PROPERTIES'
          assert result['proof']['status'] == 'PASS' and result['proof']['returncode'] == 0
          assert result['proof']['k_induction']
          assert result['proof_budget'] == {'mode': 'prove', 'depth': 12, 'wall_seconds': 180, 'attempts': 1}
          PY

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-${{ github.sha }}
          path: |
            build/evidence/
            build/ci/workbench-image.json
            test/results*.xml
            test/tb.fst
            test/tb-gl-harness.fst
            build/formal/
            build/synthesis.log
            build/synth.json
            build/spi-phase-comparison/ci/result.json
            build/spi-phase-comparison/ci/source-manifest.json
            build/spi-phase-comparison/ci/*.log
            build/spi-phase-comparison/ci/*/source.patch
            build/spi-phase-comparison/ci/*/src/*.v
            build/spi-phase-comparison/ci/*/*.xml
            build/spi-phase-comparison/ci/*/synth.json
            build/spi-phase-formal/ci/result.json
            build/spi-phase-formal/ci/*.sby
            build/spi-phase-formal/ci/*.log
            build/spi-phase-formal/ci/inputs/
            build/spi-phase-formal/ci/*/status
            build/spi-phase-formal/ci/*/PASS
            build/spi-phase-formal/ci/*/FAIL
            build/spi-phase-formal/ci/*/engine_0/trace*
            build/spi-phase-integration/ci/result.json
            build/spi-phase-integration/ci/*.sby
            build/spi-phase-integration/ci/*.log
            build/spi-phase-integration/ci/*.xml
            build/spi-phase-integration/ci/inputs/
            build/spi-phase-integration/ci/*/status
            build/spi-phase-integration/ci/*/PASS
            build/spi-phase-integration/ci/*/FAIL
            build/spi-phase-integration/ci/*/engine_0/trace*
            build/spi-mode0-pins/ci/result.json
            build/spi-mode0-pins/ci/*.sby
            build/spi-mode0-pins/ci/*.log
            build/spi-mode0-pins/ci/inputs/
            build/spi-mode0-pins/ci/*/status
            build/spi-mode0-pins/ci/*/PASS
            build/spi-mode0-pins/ci/*/FAIL
            build/spi-mode0-pins/ci/*/engine_0/trace*
            build/spi-mode0-pins/ci/*/results.xml
            build/spi-mode0-pins/ci/*/records/
            build/spi-program-invariants/ci/result.json
            build/spi-program-invariants/ci/preflight.json
            build/spi-program-invariants/ci/program.sby
            build/spi-program-invariants/ci/program.log
            build/spi-program-invariants/ci/inputs/
            build/spi-program-invariants/ci/program/status
            build/spi-program-invariants/ci/program/PASS
            build/spi-program-invariants/ci/program/FAIL
            build/spi-program-invariants/ci/program/model/design.json
            build/spi-program-invariants/ci/program/model/*.ys
            build/spi-program-invariants/ci/program/engine_0/logfile*.txt
            build/spi-program-invariants/ci/program/engine_0/trace*
            build/spi-program-invariants/ci/sim-*/driver.sv
            build/spi-program-invariants/ci/sim-*/clock.sv
            build/spi-program-invariants/ci/sim-*/compile.log
            build/spi-program-invariants/ci/sim-*/run.log
          if-no-files-found: error
          retention-days: 90
