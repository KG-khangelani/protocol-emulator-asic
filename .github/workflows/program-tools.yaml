name: program-tools
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'programs/**'
      - 'tools/**'
      - 'test/**'
      - 'src/**'
      - 'experiments/**'
      - 'Makefile'
      - 'docs/specs/g3-program-toolchain.md'
      - 'docs/programming.md'
      - '.github/workflows/program-tools.yaml'
  pull_request:
    paths:
      - 'programs/**'
      - 'tools/**'
      - 'test/**'
      - 'src/**'
      - 'experiments/**'
      - 'Makefile'
      - 'docs/specs/g3-program-toolchain.md'
      - 'docs/programming.md'
      - '.github/workflows/program-tools.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-assembly:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check Windows assembly and deterministic artifacts
        shell: pwsh
        run: |
          python -m unittest discover -s test -p test_program_tools.py
          if ($LASTEXITCODE -ne 0) { throw 'Assembler acceptance failed' }
          python tools/program_examples.py --out build/program-tools-windows
          if ($LASTEXITCODE -ne 0) { throw 'Example build failed' }
      - name: Retain Windows program artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: program-tools-windows-${{ github.sha }}
          path: build/program-tools-windows/
          if-no-files-found: error
          retention-days: 90
  public-programs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build locked workbench
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/workbench
          file: tools/workbench/Dockerfile
          load: true
          tags: protocol-emulator-asic-workbench:2026-07-29
          cache-from: type=gha,scope=protocol-emulator-workbench-2026-07-29
          cache-to: type=gha,mode=max,scope=protocol-emulator-workbench-2026-07-29
      - name: Build, load, read back and check all examples in both simulators
        run: |
          docker run --rm --pull=never --init --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace protocol-emulator-asic-workbench:2026-07-29 \
            python3 tools/run_program_examples.py --out build/g3-ci
          docker image inspect protocol-emulator-asic-workbench:2026-07-29 > build/g3-ci/workbench-image.json
      - name: Retain original toolchain verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: program-tools-public-${{ github.sha }}
          path: |
            build/g3-ci/
            !build/g3-ci/**/sim/**
            !build/g3-ci/models/**
          if-no-files-found: error
          retention-days: 90
