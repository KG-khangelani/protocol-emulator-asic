name: spi-program-sensitivity
on:
  push:
    paths:
      - 'src/**'
      - 'experiments/spi_phase/**'
      - 'test/test_spi*.py'
      - 'test/test.py'
      - 'test/Makefile'
      - 'test/tb.v'
      - 'tools/workbench/**'
      - 'tools/spi_four_mode_oracle.py'
      - 'tools/m1_contract_model.py'
      - 'tools/spi_phase_reference.py'
      - 'docs/specs/p-spi-host-4mode.md'
      - 'docs/specs/spi-program-sensitivity.md'
      - 'docs/specs/spi-held-program-proof.md'
      - 'docs/specs/spi-phase1-capacity-screen.md'
      - '.github/workflows/spi-sensitivity.yaml'
  pull_request:
    paths:
      - 'src/**'
      - 'experiments/spi_phase/**'
      - 'test/test_spi*.py'
      - 'test/test.py'
      - 'test/Makefile'
      - 'test/tb.v'
      - 'tools/workbench/**'
      - 'tools/spi_four_mode_oracle.py'
      - 'tools/m1_contract_model.py'
      - 'tools/spi_phase_reference.py'
      - 'docs/specs/p-spi-host-4mode.md'
      - 'docs/specs/spi-program-sensitivity.md'
      - 'docs/specs/spi-held-program-proof.md'
      - 'docs/specs/spi-phase1-capacity-screen.md'
      - '.github/workflows/spi-sensitivity.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spi-sensitivity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build locked workbench
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/workbench
          file: tools/workbench/Dockerfile
          load: true
          tags: protocol-emulator-asic-workbench:2026-07-29
          cache-from: type=gha,scope=protocol-emulator-workbench-2026-07-29
          cache-to: type=gha,mode=max,scope=protocol-emulator-workbench-2026-07-29
      - name: Check tools and actual-program sensitivity
        run: |
          ./tools/workbench.sh Doctor
          docker run --rm --pull=never --init --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace protocol-emulator-asic-workbench:2026-07-29 \
            python3 experiments/spi_phase/run_program_sensitivity.py --output build/spi-program-sensitivity/ci
      - name: Screen four-mode timing references and fitting public images
        run: |
          docker run --rm --pull=never --init --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace protocol-emulator-asic-workbench:2026-07-29 \
            python3 experiments/spi_phase/run_four_mode_screen.py --output build/spi-four-mode-screen/ci
      - name: Prove held-response mode-0 and mode-2 programs with checked controls
        run: |
          docker run --rm --pull=never --init --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace protocol-emulator-asic-workbench:2026-07-29 \
            python3 experiments/spi_phase/run_held_program_proof.py --output build/spi-held-proof/ci
      - name: Screen phase-1 capacity and public rejection controls
        run: |
          docker run --rm --pull=never --init --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace protocol-emulator-asic-workbench:2026-07-29 \
            python3 experiments/spi_phase/run_phase1_capacity.py --output build/spi-phase1-capacity/ci
      - name: Retain successes and counterexamples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spi-sensitivity-${{ github.sha }}
          path: |
            build/spi-phase1-capacity/ci/result.json
            build/spi-phase1-capacity/ci/boundary-tests.log
            build/spi-phase1-capacity/ci/reference-witnesses.json
            build/spi-phase1-capacity/ci/variants/source-manifest.json
            build/spi-phase1-capacity/ci/variants/compact/src/
            build/spi-phase1-capacity/ci/*/results.xml
            build/spi-phase1-capacity/ci/*/run.log
            build/spi-phase1-capacity/ci/*/records/
            build/spi-held-proof/ci/result.json
            build/spi-held-proof/ci/preflight-inputs/inputs/
            build/spi-held-proof/ci/preflight-inputs/preflight.json
            build/spi-held-proof/ci/preflight-inputs/preflight/*/driver.sv
            build/spi-held-proof/ci/preflight-inputs/preflight/*/clock.sv
            build/spi-held-proof/ci/preflight-inputs/preflight/*/*.log
            build/spi-held-proof/ci/preflight-inputs/preflight/*/trace.json
            build/spi-held-proof/ci/*/inputs/
            build/spi-held-proof/ci/*/transformation.json
            build/spi-held-proof/ci/*/proof.sby
            build/spi-held-proof/ci/*/proof.log
            build/spi-held-proof/ci/*/proof/status
            build/spi-held-proof/ci/*/proof/engine_0/trace*
            build/spi-four-mode-screen/ci/result.json
            build/spi-four-mode-screen/ci/oracle-tests.log
            build/spi-four-mode-screen/ci/reference-witnesses.json
            build/spi-four-mode-screen/ci/variants/source-manifest.json
            build/spi-four-mode-screen/ci/variants/compact/src/
            build/spi-four-mode-screen/ci/*/results.xml
            build/spi-four-mode-screen/ci/*/run.log
            build/spi-four-mode-screen/ci/*/records/
            build/spi-program-sensitivity/ci/result.json
            build/spi-program-sensitivity/ci/*/inputs/
            build/spi-program-sensitivity/ci/*/transformation.json
            build/spi-program-sensitivity/ci/*/proof.sby
            build/spi-program-sensitivity/ci/*/proof.log
            build/spi-program-sensitivity/ci/*/proof/status
            build/spi-program-sensitivity/ci/*/proof/engine_0/trace*
            build/spi-program-sensitivity/ci/simulation/*/results.xml
            build/spi-program-sensitivity/ci/simulation/*/run.log
            build/spi-program-sensitivity/ci/simulation/*/records/
          if-no-files-found: error
          retention-days: 90
