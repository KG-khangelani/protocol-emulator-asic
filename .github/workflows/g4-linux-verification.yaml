name: G4 isolated Linux verification

"on":
  push:
    branches: [codex/g4-linux-verification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical:
    if: github.repository == 'KG-khangelani/protocol-emulator-asic' && github.ref == 'refs/heads/codex/g4-linux-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the isolated verification source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github/g4-linux-verification
            evidence/E0046-program-toolchain/publication
            evidence/E0047-g4-submission-candidate/ci-43543626249
            evidence/E0047-g4-submission-candidate/ci-43543629839
      - name: Replay both frozen physical qualifications in the verified public image
        env:
          G4_CI_JOB_ID: ${{ github.job }}
        run: python3 .github/g4-linux-verification/run.py --request .github/g4-linux-verification/request.json
      - name: Retain the original Linux proof artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g4-linux-proof-${{ github.sha }}
          path: build/g4-ci-proof/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 0
