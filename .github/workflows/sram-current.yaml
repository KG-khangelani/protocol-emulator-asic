name: sram-current
run-name: G2 SRAM normal-command verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-sram:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the locked workbench
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: tools/workbench
          file: tools/workbench/Dockerfile
          load: true
          tags: protocol-emulator-asic-workbench:2026-07-29
          cache-from: type=gha,scope=protocol-emulator-workbench-2026-07-29
          cache-to: type=gha,mode=max,scope=protocol-emulator-workbench-2026-07-29
      - name: Run the normal commands on the exact isolated SRAM source
        run: |
          mkdir -p build/current-sram/runtime
          current_image=$(docker image inspect --format '{{.Id}}' protocol-emulator-asic-workbench:2026-07-29)
          docker image inspect "$current_image" > build/current-sram/runtime/workbench-image.json
          docker run --name sram-current-ci --pull=never --init --ulimit core=0 --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            "$current_image" sh -c 'python3 experiments/i2c/build_sram_candidate.py --output build/current-sram-candidate && make SOURCE_DIR=/workspace/build/current-sram-candidate/src CURRENT_ARTIFACTS=/workspace/build/current-sram doctor check lint test test-verilator formal synth evidence'
      - name: Record the actual container identity
        if: always()
        run: |
          mkdir -p build/current-sram/runtime
          docker inspect --format '{"image":{{json .Image}},"configured_image":{{json .Config.Image}},"command":{{json .Config.Cmd}},"state":{{json .State}},"mounts":{{json .Mounts}}}' sram-current-ci > build/current-sram/runtime/container.json
      - name: Retain original current verification results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-sram-${{ github.sha }}
          path: |
            build/current-sram
            build/current-sram-candidate
            !build/current-sram/**/sim/**
          if-no-files-found: error
          retention-days: 90
