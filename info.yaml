# Modified 2026-09-22: M0 metadata and competition allocation
project:
  title:        "Protocol Emulator ASIC - M1 candidate"      # Project title
  author:       "Khangelani Mgoqi"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Simulation candidate for a deterministic programmable protocol engine"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # Competition allocation verified 2026-09-22; do not infer physical dimensions here.
  tiles: "6x4"          # Jane Street competition requirement

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_khangelani_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "m1_engine.v"
    - "m1_program_store.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "loader_address[0]"
  ui[1]: "loader_address[1]"
  ui[2]: "loader_address[2]"
  ui[3]: "loader_address[3]"
  ui[4]: "loader_address[4]"
  ui[5]: "loader_length_select"
  ui[6]: "loader_write"
  ui[7]: "loader_mode"

  # Outputs
  uo[0]: "pc[0]"
  uo[1]: "pc[1]"
  uo[2]: "pc[2]"
  uo[3]: "pc[3]"
  uo[4]: "pc[4]"
  uo[5]: ""
  uo[6]: "state[0]"
  uo[7]: "state[1]"

  # Bidirectional pins
  uio[0]: "gpio[0]"
  uio[1]: "gpio[1]"
  uio[2]: "gpio[2]"
  uio[3]: "gpio[3]"
  uio[4]: "gpio[4]"
  uio[5]: "gpio[5]"
  uio[6]: "gpio[6]"
  uio[7]: "gpio[7]"

# Do not change!
yaml_version: 6
